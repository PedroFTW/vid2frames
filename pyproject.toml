[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2frames"
version = "0.1.0"
description = "Get any amount of random frames from a video"
authors = [
    {name = "Pedro Rodrigues", email = "vrodrigues.pedro@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
]

[project.scripts]
vid2frames = "vid2frames.main:main"

[tool.setuptools.packages.find]
where = ["src"]